name: Bob-Mobile Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Initialize Android Project & Inject Permissions
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Android project not found. Initializing..."
            npx tauri android init --ci
            
            echo "Injecting native permissions and portrait lock..."
            MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
            sed -i '/<\/manifest>/i \
            <uses-permission android:name="android.permission.INTERNET"/>\n\
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n\
            <uses-permission android:name="android.permission.CAMERA"/>\n\
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n\
            <uses-permission android:name="android.permission.VIBRATE"/>\n\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>\n\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' $MANIFEST
            
            echo "Setting icon background to white and patching all default purple colors..."
            python scripts/patch_android_colors.py
            
            # Lock portrait mode in activity
            sed -i '/<activity/a \            android:screenOrientation="portrait"' $MANIFEST
            
            echo "Injecting ShareActivity intent filter..."
            python scripts/patch_android_intent.py
            
            echo "Copying ShareActivity.kt to package dir..."
            mkdir -p src-tauri/gen/android/app/src/main/java/bob/agent
            cp scripts/android_patches/ShareActivity.kt src-tauri/gen/android/app/src/main/java/bob/agent/
          else
            echo "Android project already initialized."
          fi

      - name: Workaround NDK libgcc removal
        run: |
          NDK_TOOLCHAIN=$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64
          # Find the clang resource lib directory for aarch64
          CLANG_VER=$(ls $NDK_TOOLCHAIN/lib/clang/ | head -1)
          LIB_DIR="$NDK_TOOLCHAIN/lib/clang/$CLANG_VER/lib/linux/aarch64"
          if [ -d "$LIB_DIR" ] && [ -f "$LIB_DIR/libunwind.a" ] && [ ! -f "$LIB_DIR/libgcc.a" ]; then
            cp "$LIB_DIR/libunwind.a" "$LIB_DIR/libgcc.a"
            echo "Created libgcc.a symlink workaround"
          else
            echo "libgcc workaround not needed or dir not found"
          fi

      - name: Patch Android Icons (kill purple, force @mipmap refs)
        run: python scripts/patch_android_icons.py

      - name: Build APK
        run: |
          mkdir -p resources/llm-engine
          touch resources/llm-engine/dummy.exe resources/llm-engine/dummy.dll resources/llm-engine/dummy.disabled
          mkdir -p skills
          touch src-tauri/pdfium.dll
          npx tauri android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          CC_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

      - name: Sign APK
        id: sign_step
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Skipping signing: ANDROID_KEYSTORE_BASE64 secret is not configured."
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Decoding release keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/bobbik-release.p12

          # Locate built APK
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Target APK to sign: $UNSIGNED_APK"

          # Locate zipalign and apksigner in Android SDK build-tools
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")
          ALIGNED_APK="bob-v${VERSION}-aligned.apk"
          SIGNED_APK="bob-v${VERSION}-signed.apk"

          # Step 1: 4KB page alignment (mandatory for Android 11+ dynamic libraries)
          echo "Aligning APK to 4KB page boundaries..."
          $ZIPALIGN -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Step 2: Sign APK (PKCS12 format)
          echo "Signing aligned APK..."
          $APKSIGNER sign \
            --ks /tmp/bobbik-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # Step 3: Verification gates (fail build if unaligned or invalid signature)
          echo "Verifying 4KB page alignment..."
          $ZIPALIGN -c 4 "$SIGNED_APK"

          echo "Verifying APK signature..."
          $APKSIGNER verify --verbose "$SIGNED_APK"

          # Provide fixed name copy for persistent direct download
          cp "$SIGNED_APK" bob-mobile-latest.apk

          # Clean up decrypted keystore
          rm -f /tmp/bobbik-release.p12

          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bob-mobile-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            bob-*-signed.apk
            bob-mobile-latest.apk

      - name: Publish Signed APK to GitHub Releases
        if: steps.sign_step.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-mobile
          name: "Bob Mobile Latest (v${{ env.APP_VERSION }})"
          body: |
            ### 📱 Bob Mobile Android 自动构建安装包
            - **应用版本**：`v${{ env.APP_VERSION }}`
            - **代码提交**：`${{ github.sha }}`
            - **打包时间**：`${{ github.event.head_commit.timestamp }}`

            > 💡 **直接安装**：此 APK 已通过官方证书完成签名。Android 手机端直接下载下方 `bob-mobile-latest.apk` 即可直接点击覆盖安装升级，无需在电脑端解压或二次签名。
          draft: false
          prerelease: true
          files: |
            bob-*-signed.apk
            bob-mobile-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

