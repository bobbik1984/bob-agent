name: Bob Desktop Windows CI

on:
  push:
    branches:
      - main
      - mobile-pc-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify one version for both platforms
        run: node scripts/version-contract.mjs candidate

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Installer Dependencies
        working-directory: installer
        run: npm install --legacy-peer-deps

      - name: Prepare Assets & PDFium
        shell: powershell
        run: |
          # 1. 自动拉取与解压官方 PDFium 二进制
          powershell -ExecutionPolicy Bypass -File scripts/install_pdfium.ps1
          
          # 2. 占位 dummy 外部二进制资源（满足 tauri.conf.json 资源校验）
          New-Item -ItemType Directory -Force -Path "resources\llm-engine"
          New-Item -ItemType File -Force -Path "resources\llm-engine\dummy.exe"
          New-Item -ItemType File -Force -Path "resources\llm-engine\dummy.dll"
          New-Item -ItemType File -Force -Path "resources\llm-engine\dummy.disabled"
          New-Item -ItemType Directory -Force -Path "skills"

      - name: Step 1 - Build Main App Binary (bob.exe)
        run: npx tauri build --no-bundle

      - name: Step 2 - Generate Payload ZIP
        run: node scripts/build_payload.mjs

      - name: Step 3 - Inject Payload into Installer
        shell: powershell
        run: |
          Copy-Item "payload.zip" "installer/src-tauri/payload.zip" -Force

      - name: Step 4 - Build Standalone Installer (bob-installer.exe)
        working-directory: installer
        run: npx tauri build --no-bundle

      - name: Step 5 - Collect & Organize Release Artifacts
        shell: powershell
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "dist-release"
          
          # 归档安装器与便携包（带明确版本号）
          Copy-Item "installer/src-tauri/target/release/bob-installer.exe" "dist-release/bob-v${ver}-installer.exe"
          Copy-Item "payload.zip" "dist-release/bob-v${ver}-portable.zip"
          
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bob-desktop-windows-v${{ env.APP_VERSION }}-${{ github.sha }}
          path: |
            dist-release/bob-v${{ env.APP_VERSION }}-installer.exe
            dist-release/bob-v${{ env.APP_VERSION }}-portable.zip
