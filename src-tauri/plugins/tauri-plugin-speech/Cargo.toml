[package]
name = "tauri-plugin-speech"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-speech"
authors = ["BobAgent"]

[dependencies]
tauri = { version = "2.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin = { version = "2.0.0", features = ["build"] }

[build-dependencies]
tauri-plugin = { version = "2.0.0", features = ["build"] }
