[package]
name = "bob-runtime"
version = "1.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.22"
bob-kernel = { path = "../bob-kernel" }
bob-transport = { path = "../bob-transport" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "=3.27.0"
