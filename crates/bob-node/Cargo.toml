[package]
name = "bob-node"
version = "1.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
bob-kernel = { path = "../bob-kernel" }
bob-transport = { path = "../bob-transport" }
bob-runtime = { path = "../bob-runtime" }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
tempfile = "=3.27.0"
