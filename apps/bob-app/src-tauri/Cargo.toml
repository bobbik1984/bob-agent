[package]
name = "bob-app"
version = "1.0.1"
edition = "2021"
publish = false

[workspace]

[lib]
name = "bob_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
bob-kernel = { path = "../../../crates/bob-kernel" }
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
serde_json = "1"

[features]
native-tests = []
