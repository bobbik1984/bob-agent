[package]
name = "bob-app"
version = "1.0.1"
edition = "2021"
publish = false

[workspace]

[lib]
name = "bob_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
bob-transport = { path = "../../../crates/bob-transport" }
bob-kernel = { path = "../../../crates/bob-kernel" }
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring"] }
sha2 = "=0.10.9"
time = "=0.3.55"
ring = "=0.17.14"

[dev-dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled"] }
tauri = { version = "=2.11.5", features = ["test"] }
serde_json = "1"

[features]
native-tests = []
